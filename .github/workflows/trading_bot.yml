name: Weather-Ensemble Live AI Trading Bot

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  schedule:
    # Runs every 6 hours to keep continuous trading active (GitHub Actions max job timeout is 6h)
    - cron: '0 */6 * * *'

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub hard limit is 360m; exit gracefully before kill

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weather-Ensemble Live Trading Engine
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NOTIFICATIONS: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          echo "🚀 Launching Weather-Ensemble 50x AI Bot on GitHub Actions..."
          python weather_ensemble_bot.py --trade-live --sizing-mode margin --margin-pct 0.03 --leverage 50 --threshold 30
